<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Node Vault</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --subtle: #f3f4f6;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --accent: #111827;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --ok-border: #bbf7d0;
      --err: #b91c1c;
      --err-bg: #fef2f2;
      --err-border: #fecaca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 0.8rem; }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 24px 48px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 0.96rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .pill {
      font-size: 0.76rem;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--subtle);
      color: var(--muted);
    }
    .pill.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-border); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], input[type="file"] {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 7px;
      padding: 8px 15px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #1f2937; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: var(--subtle); color: var(--muted); font-weight: 500; font-size: 0.78rem; }
    tr:last-child td { border-bottom: none; }
    .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; display: none; font-size: 0.84rem; }
    .msg.ok { display: block; background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok); }
    .msg.err { display: block; background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1 id="nodeTitle">Client Node Vault</h1>
        <p>Isolated container storage &middot; Raw data and secret keys never leave this node</p>
      </div>
      <span class="pill ok">Private Vault</span>
    </div>
  </header>

  <div class="container">
    <div id="statusMsg" class="msg"></div>

    <section class="card">
      <h2>1. Dataset Upload <span class="pill" id="datasetBadge">No Dataset</span></h2>
      <div class="grid-2" style="margin-bottom: 12px;">
        <div>
          <label for="orgInput">Organization Name</label>
          <input type="text" id="orgInput" placeholder="e.g. Organization A" />
        </div>
        <div>
          <label for="tagInput">Location / Tag</label>
          <input type="text" id="tagInput" placeholder="e.g. Site 1" />
        </div>
      </div>
      <div style="margin-bottom: 14px;">
        <label for="csvFile">CSV File</label>
        <input type="file" id="csvFile" accept=".csv,text/csv" />
      </div>
      <button class="btn" onclick="uploadDataset()">Save to Local Vault</button>
    </section>

    <section class="card">
      <h2>2. Local Preview (Private to This Node)</h2>
      <div id="localSummary" style="color: var(--muted); font-size: 0.83rem;">Loading...</div>
      <div class="table-wrap" id="previewTableWrap" style="display:none;"></div>
    </section>

    <section class="card">
      <h2>3. Node Activity Log</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Timestamp</th><th>Job ID</th><th>Engine</th><th>Action</th><th>Isolation</th></tr></thead>
          <tbody id="auditBody"><tr><td colspan="5" style="color:var(--muted);">No jobs executed yet.</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    function showMsg(text, ok) {
      const el = document.getElementById("statusMsg");
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
    }

    async function refreshNode() {
      const [statusResp, prevResp] = await Promise.all([
        fetch("api/node/status"),
        fetch("api/local/preview")
      ]);
      const st = await statusResp.json();
      const pv = await prevResp.json();

      document.getElementById("nodeTitle").textContent = `${st.organization} (${st.node_id})`;
      document.getElementById("orgInput").value = st.organization || "";
      document.getElementById("tagInput").value = st.tag || "";

      const badge = document.getElementById("datasetBadge");
      if (st.dataset_loaded) {
        badge.textContent = `${st.row_count} rows · ${st.dataset_filename}`;
        badge.className = "pill ok";
      } else {
        badge.textContent = "No Dataset";
        badge.className = "pill";
      }

      const sumDiv = document.getElementById("localSummary");
      const wrap = document.getElementById("previewTableWrap");
      if (pv.preview_rows && pv.preview_rows.length) {
        const cols = st.columns || Object.keys(pv.preview_rows[0]);
        sumDiv.textContent = `Columns: ${cols.join(", ")}`;
        let html = "<table><thead><tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
        for (const row of pv.preview_rows) {
          html += "<tr>" + cols.map(c => `<td>${row[c] ?? ""}</td>`).join("") + "</tr>";
        }
        html += "</tbody></table>";
        wrap.innerHTML = html;
        wrap.style.display = "block";
      } else {
        sumDiv.textContent = "No dataset uploaded yet.";
        wrap.style.display = "none";
      }

      const tbody = document.getElementById("auditBody");
      const logs = st.audit_history || [];
      if (!logs.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);">No jobs executed yet.</td></tr>';
      } else {
        tbody.innerHTML = logs.map(ev => `
          <tr>
            <td>${(ev.timestamp || "").replace("T", " ").slice(0, 19)}</td>
            <td class="mono">${ev.job_id || ""}</td>
            <td>${ev.engine || ""}</td>
            <td>${ev.action || ""}</td>
            <td>${ev.secret_key_purged ? "Key share purged" : (ev.net_tx_bytes ? `${ev.net_tx_bytes} B TX` : "Local")}</td>
          </tr>
        `).join("");
      }
    }

    async function uploadDataset() {
      const fileEl = document.getElementById("csvFile");
      if (!fileEl.files || !fileEl.files[0]) {
        showMsg("Please select a CSV file first.", false);
        return;
      }
      const csvText = await fileEl.files[0].text();
      const resp = await fetch("api/node/dataset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          csv_text: csvText,
          filename: fileEl.files[0].name,
          organization: document.getElementById("orgInput").value,
          tag: document.getElementById("tagInput").value
        })
      });
      const data = await resp.json();
      if (!resp.ok) {
        showMsg(data.error || "Upload failed", false);
        return;
      }
      showMsg(`Saved ${data.meta.row_count} rows to ${data.meta.node_id}.`, true);
      refreshNode();
    }

    refreshNode();
    setInterval(refreshNode, 8000);
  </script>
</body>
</html>
