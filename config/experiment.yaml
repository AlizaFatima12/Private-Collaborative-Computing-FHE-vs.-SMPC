# Master Experiment Configuration for Private Collaborative Computing: FHE vs. SMPC
# Domain: 3-Hospital Multi-Region Collaborative Disease Research
experiment:
  name: "fhe_vs_smpc_hospital_disease_research"
  version: "1.0.0"
  domain: "multi_hospital_disease_research"
  random_seed: 42
  num_participants: 3
  participants:
    - id: "participant_a"
      index: 0
      organization: "Hospital Alpha (Northern Mountain Region)"
      region: "NORTHERN_MOUNTAIN"
      host: "participant_a"
      fhe_port: 9100
      smpc_port: 5000
    - id: "participant_b"
      index: 1
      organization: "Hospital Beta (Coastal Maritime Region)"
      region: "COASTAL_MARITIME"
      host: "participant_b"
      fhe_port: 9101
      smpc_port: 5001
    - id: "participant_c"
      index: 2
      organization: "Hospital Gamma (Metro Urban Center)"
      region: "METRO_URBAN"
      host: "participant_c"
      fhe_port: 9102
      smpc_port: 5002

datasets:
  clinical_scale_factor: 1
  biomarker_min: 10
  biomarker_max: 200
  severity_min: 1
  severity_max: 10
  # Backward-compatible aliases for benchmark bounds
  amount_min: 10
  amount_max: 200
  risk_score_min: 1
  risk_score_max: 10
  partition_strategy: "regional_diverse_deterministic"
  profiles:
    small: 100
    medium: 1000
    large: 10000
    very_large: 50000
    stress_test: 100000

workloads:
  aggregation:
    name: "Multi-Center Disease Cohort Aggregation"
    description: "Computes exact global sum of patient clinical biomarker levels, total cohort size, and exact multi-region mean post-reconstruction without sharing patient records."
    operations:
      - "sum"
      - "count"
      - "average"
    division_policy: "post_decryption_exact"
    authorized_recipients:
      - "participant_a"
      - "participant_b"
      - "participant_c"

  risk_multiplication:
    name: "Collaborative Disease Severity Risk Index"
    description: "Computes weighted disease severity exposure sum(x_i * w_i) where both patient biomarker reading x_i and clinical comorbidity weight w_i remain encrypted/secret-shared."
    formula: "RISK_TOTAL = SUM(x_i * w_i)"
    weight_visibility: "private"
    requires_ciphertext_multiplication: true
    requires_beaver_triples: true
    authorized_recipients:
      - "participant_a"
      - "participant_b"
      - "participant_c"

execution:
  default_mode: "standard"
  warmup_runs: 1
  repetitions: 5
  confidence_level: 0.95
  validate_against_plaintext: true
  fail_on_backend_unavailable: true
  matrices:
    quick:
      dataset_profiles: ["small", "medium", "large"]
      workloads: ["aggregation", "risk_multiplication"]
      latency_profiles: ["local", "fast_wan", "moderate_wan", "slow_wan", "high_latency"]
      bandwidth_profiles: ["high", "medium", "restricted", "very_restricted"]
      warmup_runs: 1
      repetitions: 5
    standard:
      dataset_profiles: ["small", "medium", "large", "very_large", "stress_test"]
      workloads: ["aggregation", "risk_multiplication"]
      latency_profiles: ["local", "fast_wan", "moderate_wan", "slow_wan", "high_latency"]
      bandwidth_profiles: ["high", "medium", "restricted", "very_restricted"]
      warmup_runs: 1
      repetitions: 5
    full:
      dataset_profiles: ["small", "medium", "large", "very_large", "stress_test"]
      workloads: ["aggregation", "risk_multiplication"]
      latency_profiles: ["local", "fast_wan", "moderate_wan", "slow_wan", "high_latency"]
      bandwidth_profiles: ["high", "medium", "restricted", "very_restricted"]
      warmup_runs: 2
      repetitions: 5
