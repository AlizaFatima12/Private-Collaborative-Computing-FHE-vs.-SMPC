services:
  node-1:
    image: private-collaborative-computing-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcc_node_1
    cap_add:
      - NET_ADMIN
    ports:
      - "9101:9101"
    environment:
      - PCC_NODE_INDEX=0
      - PCC_NODE_PORT=9101
      - PCC_NODE_ORG=Organization 1
      - PCC_NODE_TAG=Site-1
      - PCC_NODE_DATA_DIR=/app/node_data
      - PCC_MPSPDZ_DIR=/opt/mp-spdz
      - PCC_NETWORK_INTERFACE=eth0
      - PYTHONPATH=/app
    volumes:
      - ./system:/app/system
      - ./fhe:/app/fhe
      - ./smpc:/app/smpc
      - ./networking:/app/networking
      - ./config:/app/config
      - ./volumes/node1:/app/node_data
    networks:
      - pcc_mesh
    command: ["python3", "-m", "system.node_agent", "--index", "0", "--port", "9101"]

  node-2:
    image: private-collaborative-computing-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcc_node_2
    cap_add:
      - NET_ADMIN
    ports:
      - "9102:9102"
    environment:
      - PCC_NODE_INDEX=1
      - PCC_NODE_PORT=9102
      - PCC_NODE_ORG=Organization 2
      - PCC_NODE_TAG=Site-2
      - PCC_NODE_DATA_DIR=/app/node_data
      - PCC_MPSPDZ_DIR=/opt/mp-spdz
      - PCC_NETWORK_INTERFACE=eth0
      - PYTHONPATH=/app
    volumes:
      - ./system:/app/system
      - ./fhe:/app/fhe
      - ./smpc:/app/smpc
      - ./networking:/app/networking
      - ./config:/app/config
      - ./volumes/node2:/app/node_data
    networks:
      - pcc_mesh
    command: ["python3", "-m", "system.node_agent", "--index", "1", "--port", "9102"]

  node-3:
    image: private-collaborative-computing-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcc_node_3
    cap_add:
      - NET_ADMIN
    ports:
      - "9103:9103"
    environment:
      - PCC_NODE_INDEX=2
      - PCC_NODE_PORT=9103
      - PCC_NODE_ORG=Organization 3
      - PCC_NODE_TAG=Site-3
      - PCC_NODE_DATA_DIR=/app/node_data
      - PCC_MPSPDZ_DIR=/opt/mp-spdz
      - PCC_NETWORK_INTERFACE=eth0
      - PYTHONPATH=/app
    volumes:
      - ./system:/app/system
      - ./fhe:/app/fhe
      - ./smpc:/app/smpc
      - ./networking:/app/networking
      - ./config:/app/config
      - ./volumes/node3:/app/node_data
    networks:
      - pcc_mesh
    command: ["python3", "-m", "system.node_agent", "--index", "2", "--port", "9103"]

  coordinator:
    image: private-collaborative-computing-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcc_coordinator
    cap_add:
      - NET_ADMIN
    depends_on:
      - node-1
      - node-2
      - node-3
    ports:
      - "8501:8501"
    environment:
      - PCC_COORDINATOR_PORT=8501
      - PCC_NODE_URLS=http://node-1:9101,http://node-2:9102,http://node-3:9103
      - PCC_COORDINATOR_DATA_DIR=/app/coordinator_data
      - PCC_MPSPDZ_DIR=/opt/mp-spdz
      - PCC_NETWORK_INTERFACE=eth0
      - PYTHONPATH=/app
    volumes:
      - ./system:/app/system
      - ./fhe:/app/fhe
      - ./smpc:/app/smpc
      - ./networking:/app/networking
      - ./config:/app/config
      - ./sample_datasets:/app/sample_datasets
      - ./volumes/coordinator:/app/coordinator_data
    networks:
      - pcc_mesh
    command: ["python3", "-m", "system.web_app", "--host", "0.0.0.0", "--port", "8501"]

  test:
    profiles: ["tools"]
    image: private-collaborative-computing-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcc_test_suite
    cap_add:
      - NET_ADMIN
    environment:
      - PCC_MPSPDZ_DIR=/opt/mp-spdz
      - PYTHONPATH=/app
    volumes:
      - .:/app
    command: ["pytest", "-v", "tests/"]

networks:
  pcc_mesh:
    driver: bridge
